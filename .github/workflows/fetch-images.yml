name: fetch-incoming-images
on:
  push:
    paths: ['incoming/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images listed in incoming/urls.txt
        run: |
          # 清單被刪除（清理暫存）時也會觸發，這時直接結束，不算失敗
          if [ ! -f incoming/urls.txt ]; then
            echo "incoming/urls.txt 不存在，無需下載"
            exit 0
          fi
          mkdir -p incoming/raw
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL -A "Mozilla/5.0" -o "incoming/raw/$name" "$url" || echo "FAILED $name"
          done < incoming/urls.txt
          ls -la incoming/raw
          git config user.name "radioone-bot"
          git config user.email "radioone-bot@users.noreply.github.com"
          git add incoming/raw
          if git diff --cached --quiet; then
            echo "沒有新的圖片，結束"
            exit 0
          fi
          git commit -m "自動下載待處理圖片"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
